[pytest]
# Pytest Configuration for Aether Backend

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11

# Addopts - default pytest options
# NOTE: Coverage is NOT in addopts — it is opt-in via CLI or the [coverage] profile.
# This keeps unit-only runs fast and CI-friendly.
#   Fast run:     pytest tests/unit/
#   With cov:     pytest --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=25
#   CI unit:      pytest tests/unit/ -m unit --no-cov -q
#   CI integration: pytest tests/integration/ -m integration --no-cov -q
addopts =
    # Use importlib mode to prevent module name collisions when test files
    # in different directories share the same filename (e.g. test_trail_hierarchy.py
    # in tests/unit/ws/ and tests/integration/). Default 'prepend' mode imports
    # by filename only, causing "import file mismatch" collection errors.
    --import-mode=importlib
    # Verbose output
    -v
    # Show test durations (slowest 10)
    --durations=10
    # Show extra test summary info
    -ra
    # Enable strict markers
    --strict-markers
    # Disable warnings summary
    -p no:warnings
    # Show local variables in tracebacks
    -l
    # Asyncio mode
    --asyncio-mode=auto

# Markers - define custom test markers
markers =
    unit: Unit tests that test individual components
    integration: Integration tests that test component interactions
    e2e: End-to-end tests that test complete workflows
    slow: Tests that take significant time to run (deselect with '-m "not slow"')
    requires_db: Tests that require database connection
    requires_services: Tests that require external services
    skip_ci: Tests to skip in CI environment
    heavy: Tests that load large ML models (>4 GB RAM) — run with -m heavy

# Asyncio configuration
asyncio_mode = auto

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test_output.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Test output
console_output_style = progress

# Filterwarnings - ignore specific warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Environment variables
# SKIP_SERVICE_HEALTH_CHECK prevents Docker/Supabase auto-start during test collection.
# Unit tests must NEVER touch real infrastructure.
env =
    TESTING=1
    AETHER_ENVIRONMENT=test
    SKIP_SERVICE_HEALTH_CHECK=1

