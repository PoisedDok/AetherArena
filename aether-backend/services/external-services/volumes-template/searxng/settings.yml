# Aether SearXNG Configuration
# Curated from backup for robust multi-source research.
# This file is used as a template during onboarding (setup_engine.py).

use_default_settings: true

general:
  instance_name: 'aether-searxng'
  enable_metrics: true

search:
  # Autocomplete providers: "google", "duckduckgo", "brave", "wikipedia", etc.
  autocomplete: 'google'
  autocomplete_min: 3
  favicon_resolver: 'google'
  default_lang: 'auto'
  safe_search: 0
  formats:
    - html
    - json  # Required for Perplexica integration

  # Porting 'Gold' suspension logic from backup to prevent engine thrashing
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 60
    SearxEngineTooManyRequests: 60
    cf_SearxEngineCaptcha: 300 # 5 mins for Cloudflare bans
    cf_SearxEngineAccessDenied: 300
    recaptcha_SearxEngineCaptcha: 300

server:
  # The secret_key is overwritten by SEARXNG_SECRET environment variable.
  secret_key: "YX9o9ls0U4GES5cPOkNnVPj7LaQMhl"
  limiter: false
  image_proxy: true
  method: "POST"

outgoing:
  # Default timeouts
  request_timeout: 10.0
  max_request_timeout: 45.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

  # No global proxy: surface web traffic connects directly to avoid bans
  using_tor_proxy: false

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true

# --- Categories ---
categories_as_tabs:
  general:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:

# --- Hostnames Plugin Config ---
hostnames:
  remove:
    - '(.*\.)?facebook.com$'
  low_priority:
    - '(.*\.)?google(\..*)?$'
  high_priority:
    - '(.*\.)?wikipedia.org$'

