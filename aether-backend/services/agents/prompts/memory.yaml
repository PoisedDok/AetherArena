# Memory Agent Prompt Template
# Version: 1.0.0
# Purpose: Extract meaningful memories from conversations
# Model: Configurable (default: lfm-2.5)

agent_type: memory
version: "1.0.0"
description: "Memory extraction from raw conversation messages"

# Required template variables
variables:
  - messages  # Raw conversation messages to process

# Default agent configuration
default_config:
  min_importance: 0.3
  trigger_frequency: 10
  execution_trigger: "scheduled"
  enabled: true

# Prompt template (user-editable via Agents Modal)
prompt_template: |
  Extract meaningful memories from this conversation:

  {messages}

  Focus on:
  - People, roles, relationships
  - Project context, current status
  - Deadlines, tasks, obligations
  - User preferences, style, rules
  - Key decisions and conclusions
  - Defined terms or specific requirements

  Output JSON array of memories:
  [
    {{
      "type": "entity|fact|decision|preference|deadline|task",
      "content": "memory content",
      "importance": 0.0-1.0,
      "tags": ["tag1", "tag2"]
    }}
  ]

  Exclude meaningless or generic chatter.
