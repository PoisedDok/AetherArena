# Legal Research Agent Prompt Template
# Version: 1.0.0
# Purpose: Research legal questions with case law and statutes
# Model: Configurable (default: lfm-2.5)

agent_type: research
version: "1.0.0"
description: "Legal research with case law and statutory analysis"

# Required template variables
variables:
  - question      # Legal question to research
  - jurisdiction  # Jurisdiction (federal, state, etc.)

# Default agent configuration
default_config:
  search_depth: "deep"
  jurisdiction: "federal"
  citation_format: "bluebook"
  execution_trigger: "on_demand"

# Prompt template (user-editable via Agents Modal)
prompt_template: |
  Research this legal question:

  {question}

  Jurisdiction: {jurisdiction}

  Find and analyze:
  1. Relevant Case Law:
     - Controlling precedents
     - Recent decisions
     - Citation validation
     
  2. Applicable Statutes:
     - Relevant code sections
     - Regulations
     - Recent amendments
     
  3. Legal Standards:
     - Burden of proof
     - Required elements
     - Defenses available
     
  Provide annotated research memo with:
  - Citations (Bluebook format)
  - Key holdings
  - Application to current question
  - Jurisdictional variations
