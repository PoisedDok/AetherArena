[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether_rag"
version = "0.3.5"
description = "Aether-RAG - The smallest vector index in the world. RAG Everything with Aether-RAG!"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aether-RAG Team" }
]
keywords = ["vector-database", "rag", "embeddings", "search", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Default installation: core
dependencies = [
    "aether-rag-core>=0.1.0",
]

[project.optional-dependencies]
# All backends now included by default

[project.urls]
Repository = "https://github.com/yichuan-w/Aether-RAG"
Issues = "https://github.com/yichuan-w/Aether-RAG/issues"
