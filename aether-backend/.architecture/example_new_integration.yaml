Incoming: Architecture standards (data_flow_standard, module_structure_standard), integrations registry --- {Dict[str, Any], yaml}
Processing: Authoritative guide + template for registering backend integrations --- {3 jobs: JOB_LOG, JOB_TRACE, JOB_VALIDATE_SCHEMA}
Outgoing: Integration loader, tools registry --- {Dict[str, Any], yaml}

version: "3.0.0"
purpose: "Complete, production-ready example for adding a new backend integration across all required layers."
references:
  standards:
    - ".architecture/data_flow_standard.yaml"
    - ".architecture/module_structure_standard.yaml"
    - ".architecture/security_compliance_standard.yaml"
  manifests:
    - ".architecture/backend_manifest.yaml"
  registries:
    - "config/integrations_registry.yaml"

extension_checklist:
  - "Create provider package under core.integrations.providers.<your_integration>/"
  - "Implement Layer 1 service/library code with type hints and docstrings"
  - "Expose Layer 2 symbols in __init__.py with __all__"
  - "Register Layer 3 entry in config/integrations_registry.yaml"
  - "List tools in config/tools_registry.yaml"
  - "Implement Layer 4 loader in integrations/runtime/integration_loader.py"
  - "Add health checks and timeout/retry config in settings.* profiles"
  - "Update .architecture/ standards if introducing new jobs"
  - "Add observability (logs, metrics, tracing) and redact secrets"
  - "Write unit + integration tests; run job_tracer and validators"

schema_template:
  id: "snake_case_identifier"
  enabled: true
  priority: 1
  type: "service" # enum: service|library|dynamic|bridge|builtin
  description: "Short description of the integration"
  layer1_implementation:
    module: "core.integrations.providers.<id>.service" # importable module path
    files:
      - "service.py"
  layer2_exposure:
    init_file: "core.integrations.providers.<id>" # package __init__.py
    exports: # public functions/classes to expose
      - "<id>_do_thing"
      - "<id>_health"
  layer3_metadata:
    tool_count: 1
    category: "taxonomy_category_here" # see canonical taxonomy
    requires_service: false
    service_url: null # e.g. "http://localhost:8000" when requires_service=true
    health_check: null # e.g. "http://localhost:8000/health"
  layer4_runtime:
    namespace: "computer.<id>" # attachment point within interpreter.computer
    loader_method: "_load_<id>" # function implemented in integration_loader.py
    initialization_order: 0
    attach_as: "functions" # enum: functions|namespace|builtin
    register_discoverable: false
    bridge_file: null # optional for dynamic/bridge types
  dependencies:
    external: [] # pip packages
    platform: [] # os/platform constraints
    optional: [] # optional external systems
    builtin: [] # stdlib
  tools_reference:
    registry_file: "tools_registry.yaml"
    category: "taxonomy_category_here"
    tool_paths:
      - "computer.<id>.<exported_function>"
  security:
    secrets_env: [] # env var names required
    scopes: [] # permission scopes enforced by backend
    redaction:
      fields: [] # fields to redact in logs
      policy_ref: ".architecture/security_compliance_standard.yaml"
  observability:
    logs:
      - "Provider logs tagged with provider_id=<id>"
    metrics:
      - "INTEGRATION_HEALTH_GAUGE{provider='<id>'}"
    tracing:
      - "integration.<id>.* spans with latency + status"
  error_handling:
    timeout_seconds: 10
    retry:
      attempts: 2
      backoff: "exponential_jitter"
    circuit_breaker:
      failure_threshold: 5
      reset_seconds: 30
  validation:
    layer1_requirements:
      - "Typed public functions, no side effects on import"
    layer2_requirements:
      - "__all__ lists all exports"
      - "Clean import structure"
    layer3_requirements:
      - "integration registered here and tools in tools_registry.yaml"
      - "health_check present when requires_service=true"
    layer4_requirements:
      - "loader implemented; attach to interpreter.computer"
      - "log success/failure"
  contracts:
    http_endpoints: [] # list when type=service with HTTP
    websocket_contracts: [] # list when streaming
  testing:
    unit:
      - "tests/unit/integrations/<id>/test_service.py"
    integration:
      - "tests/integration/integrations/<id>/test_roundtrip.py"
    e2e:
      - "tests/e2e/test_stream_roundtrip.py::test_<id>_path"
  change_management:
    bump_policy: "patch for fixes, minor for behavior change, major for contract change"
    docs:
      - "Architecture documentation"
    tooling:
      - "python scripts/job_tracer.py list --sort frequency"
      - "python scripts/validate_config.py --check-services"

example_registration:
  integrations:
    example_service:
      enabled: true
      priority: 1
      type: service
      description: Example HTTP-based provider with two exported tools
      layer1_implementation:
        module: core.integrations.providers.example_service.service
        files:
          - service.py
          - client.py
      layer2_exposure:
        init_file: core.integrations.providers.example_service
        exports:
          - example_convert
          - example_health
      layer3_metadata:
        tool_count: 2
        category: document_processing_text
        requires_service: true
        service_url: http://localhost:9000
        health_check: http://localhost:9000/health
      layer4_runtime:
        namespace: computer.example
        loader_method: _load_example_service
        initialization_order: 6
        attach_as: functions
        register_discoverable: false
      dependencies:
        external:
          - httpx
        platform: []
        optional:
          - "ExampleService running on port 9000"
        builtin:
          - asyncio
      tools_reference:
        registry_file: tools_registry.yaml
        category: document_processing_text
        tool_paths:
          - computer.example.example_convert
          - computer.example.example_health
      security:
        secrets_env:
          - EXAMPLE_API_KEY
        scopes:
          - "integration:example:invoke"
      redaction:
        fields:
          - "api_key"
          - "Authorization"
        policy_ref: ".architecture/security_compliance_standard.yaml"
      observability:
        logs:
          - "Provider example_service logs include provider_id and correlation_id"
        metrics:
          - "INTEGRATION_HEALTH_GAUGE{provider='example_service'}"
          - "REQUEST_LATENCY{provider='example_service'}"
        tracing:
          - "integration.example_service.request"
          - "integration.example_service.health"
      error_handling:
        timeout_seconds: 8
        retry:
          attempts: 2
          backoff: exponential_jitter
        circuit_breaker:
          failure_threshold: 5
          reset_seconds: 20
      validation:
        layer1_requirements:
          - "Type hints and docstrings"
        layer2_requirements:
          - "__all__ lists exports"
        layer3_requirements:
          - "Registered here; tools in tools_registry.yaml"
          - "Health endpoint configured"
        layer4_requirements:
          - "Loader implemented and logged"
      contracts:
        http_endpoints:
          - "POST /v1/example/convert"
          - "GET /v1/example/health"
        websocket_contracts: []
      testing:
        unit:
          - "tests/unit/integrations/example_service/test_service.py"
        integration:
          - "tests/integration/integrations/example_service/test_roundtrip.py"
        e2e:
          - "tests/e2e/test_stream_roundtrip.py::test_example_service_path"
      change_management:
        bump_policy: minor
        docs:
          - "Architecture documentation"
        tooling:
          - "python scripts/job_tracer.py trace JOB_EXECUTE_TOOL"
          - "python scripts/validate_config.py --check-services"

loader_stub:
  file: "integrations/runtime/integration_loader.py"
  method: |
    def _load_example_service(self) -> bool:
        try:
            from core.integrations.providers.example_service import example_convert, example_health
            self.computer.example.example_convert = example_convert
            self.computer.example.example_health = example_health
            self.logger.info("Loaded example_service integration")
            return True
        except Exception as exc:
            self.logger.warning("Failed to load example_service integration: %s", exc)
            return False

tools_registry_stub:
  file: "config/tools_registry.yaml"
  add:
    document_processing_text:
      - "computer.example.example_convert"
      - "computer.example.example_health"

validation_commands:
  - "python scripts/job_tracer.py list --sort frequency"
  - "python scripts/validate_config.py --check-services --strict"
  - "pytest tests/integration/test_all_endpoints.py -k example_service"


