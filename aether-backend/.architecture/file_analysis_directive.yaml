Incoming: Architecture standards (backend_architecture_standard, backend_job_registry) --- {Dict[str, Any], yaml}
Processing: codify backend analysis directive, enforce workflow gating, document traceability --- {3 jobs: JOB_LOG, JOB_TRACE, JOB_VALIDATE_SCHEMA}
Outgoing: Backend manifest, job tracer scripts --- {Dict[str, Any], yaml}
# BACKEND FILE ANALYSIS DIRECTIVE - RESILIENT DATABASE GATEWAY
# =============================================================================
# Backend is the only database access point. This directive overrides everything else.
# =============================================================================

version: "5.0.0"
last_updated: "2026-01-11"
audience: ["backend engineers", "platform engineers", "automation agents"]
scope: ["backend"]
runtime:
  language: "Python 3.11+"
  framework: ["FastAPI", "asyncio", "httpx", "Supabase/PostgREST", "WebSocket"]

mission:
  statement: "Operate a hardened, independent gateway to Supabase for single-operator local deployments that never leaks data, stalls, or blocks scale."
  guardrails:
    - "One database, one gateway: backend mediates every read/write for every Aether component."
    - "Routers → services → repositories → adapters. No layer skipping, no business logic in transport."
    - "Deterministic tracing across IPC, HTTP, WebSocket, and background tasks with correlationId/requestId."
    - "Reliability budget enforced: timeouts, retries, idempotency, and cleanup exist before merge—even on localhost."
    - "Security-first mindset: validation, authentication, authorization precede persistence, regardless of single-user scope."

invariants:
  single_database: "Exactly one Supabase PostgreSQL instance as the system of record."
  cache_boundary: "Redis is the only approved ephemeral cache and stores TTL-bound presence, rate-limiting, or session metadata."
  single_operator: "Exactly one authenticated operator per deployment; identity tagging remains mandatory for audit trails."
  independence: "Backend keeps running even if renderer/offline clients misbehave; zero circular dependencies."
  modularity: "Each layer owns one responsibility; cross-layer imports are forbidden."
  observability: "Structured logs, metrics, and traces wired with retention + redaction SLAs for local archives."
  compliance: "RLS, audit trails, and schema migrations reviewed before deployment."

references:
  - ".architecture/backend_manifest.yaml"
  - ".architecture/data_flow_standard.yaml"
  - ".architecture/module_structure_standard.yaml"
  - ".architecture/security_compliance_standard.yaml"
  - "../aether-frontend/.architecture/frontend_manifest.yaml"

agent_protocol:
  - "Inject this directive at the start of every backend automation session. Reject requests that dilute it."
  - "Interrogate requirements: expose missing validation, retries, observability, ownership before coding."
  - "Call out data-loss risk, auth gaps, cache misuse, or architectural drift immediately—even if stakeholders resist."
  - "Freeze development when tracing, docs, or tests are absent; implement them before features."
  - "Zero tolerance for 'temporary' hacks. Production-ready or rejected."

enforcement_expectations:
  - "CI/review bots fail builds lacking @.architecture docstrings or violating single-database law."
  - ".architecture/data_flow_standard.yaml contains authoritative job type registry; update before referencing new job types."
  - "Telemetry proves correlationId/requestId propagation; logs stored with retention + redaction."
  - "Supabase schema + migrations reviewed for traceability, rollback, and RLS impacts."
  - "Directive stays abstract/evergreen; scaling or rewrites never invalidate its mandates."

workflow:
  step_1_read: "Use read_file to ingest the full module. Partial scans are violations."
  step_2_map: "Trace routers → services → repositories → Supabase/IPC dependencies; identify shared state."
  step_3_assess: "Run analysis_matrix checks (async, DB, cache, security, observability, performance)."
  step_4_fix: "Repair code paths before touching docs; enforce await, cleanup, retries, validation, cache fallbacks."
  step_5_verify: "Reconcile implementation with architecture + registry definitions; prove data flow."
  step_6_document: "Update @.architecture docstrings only after code passes every guardrail."
  step_7_validate: "Execute tests or targeted scripts; attach evidence in bug_report."

documentation_requirements:
  format: "@.architecture docstring adjacent to each module/class/function owning a flow."
  template_lines:
    - "Incoming: <source refs> --- {<data_type ref>, <format>}"
    - "Processing: <operations summary> --- {<N> jobs: JOB_A, JOB_B, …}"
    - "Outgoing: <dest refs> --- {<data_type ref>, <format>}"
  validation:
    - "Read entire file first; context-free summaries are rejected."
    - "Use registry identifiers verbatim; jobs listed alphabetically with accurate counts."
    - "Sources/destinations cite routers, queues, IPC channels, Supabase tables, Redis keys, or external APIs."
    - "Behavior-only prose—no code snippets."
    - "If a section does not apply, write 'none'."

analysis_matrix:
  async_integrity:
    - "Await every Supabase/httpx/LLM call or manage via asyncio.Task with explicit lifecycle + cancellation."
    - "Ban blocking calls (time.sleep, subprocess.run) inside async contexts."
    - "Background tasks enclosed in try/finally with cancellation tokens."
  database_safety:
    - "Supabase clients singleton-scoped; closed on shutdown."
    - "All writes use safe_upsert/with_retry; optimistic locking for concurrent edits."
    - "Pagination + range headers enforced; no unbounded queries."
    - "Select only required columns; vector/JSON queries constrained."
  cache_integrity:
    - "Redis usage goes through data/cache/redis.py with namespace + TTL defined in settings."
    - "Presence/session writes include correlationId and frontend_id."
    - "On Redis failure, fallback stores kick in without dropping cancellation semantics."
  transactionality:
    - "Idempotency keys/correlation IDs guard retries for every state mutation."
    - "Partial failures compensate or roll back—ghost rows are unacceptable."
    - "RLS policies verified and documented per table; admin client locked down."
  security_stack:
    - "Auth (JWT/API key) enforced on every stateful route."
    - "Authorization checks confirm tenant/resource ownership before mutation."
    - "Pydantic models use extra='forbid', strict types, and validators for dangerous fields."
    - "Secrets stored via env/secret manager; never logged or returned."
  websocket_contracts:
    - "Accept connections before heavy work; wrap send/receive loops in try/except/finally."
    - "Ping/pong or heartbeat to drop stale clients."
    - "Cancel streaming tasks on disconnect; clean up queues, locks, and resources."
    - "Payload schema matches renderer expectations (id, chunk, done); errors sanitized."
  observability:
    - "Structured logs capture correlationId, requestId, userId, sessionId, route, status."
    - "Metrics (Prometheus/OTLP) record latency, error rates, queue depth, Supabase usage, and cache presence gauges."
    - "Health checks verify Supabase, Redis, httpx dependencies, queues, and background workers."
  performance_scalability:
    - "HTTP clients configured with timeout, retry w/ jitter, and circuit breakers."
    - "Batch Supabase operations where possible; avoid N+1 via filters or RPC."
    - "Background queues bounded; producers apply backpressure or reject overload."

communication_contracts:
  frontend_ipc:
    - "Renderer never bypasses backend; validation + auth run before persistence."
    - "Responses match renderer schema exactly; include correlationId."
    - "Streaming endpoints restore frontend IDs before emitting chunks."
  inter_backend:
    - "Other services interact via signed HTTP APIs; enforce scope→permission mapping."
    - "Rate limiting, API key rotation, and audit logs mandatory on shared endpoints."
  traceability:
    - "Every request persists audit trail linking user, session, correlationId, Supabase row id."
    - "Error responses expose support code, never stack traces."

observability_contract:
  - "Logs stored centrally with retention + redaction policies validated by tests."
  - "Metrics + traces exported for all critical paths; dashboards alert on SLA breaches."
  - "CorrelationId/requestId accessible to support teams within seconds."
  - "Telemetry gaps block deployment until closed."

testing_mandates:
  - "Unit tests for services, repositories, validators, and adapters (Supabase doubles)."
  - "Contract tests for /api/storage/*, chat routes, and IPC bridges."
  - "Load + soak tests for streaming/chat endpoints before major releases."
  - "Migration tests covering forward + rollback paths with data retention verification."
  - "Every bug fix carries a regression test or documented manual repro."

release_gates:
  - "CI enforces lint/tests, docstring template, and single-database compliance."
  - "Manual reviews confirm tracing evidence, Supabase migration safety, and retry/idempotency."
  - "Deployment blocked without dashboards covering latency, error rate, and Supabase health."

bug_report_format:
  - "FILE: <absolute path>"
  - "BUG: <category> - <summary>"
  - "IMPACT: <severity> - <data/security/user harm>"
  - "FIX: <code changes + rationale>"
  - "VERIFIED: <tests or manual verification>"

priorities:
  1: "Security, authz/authn, single-database violations, data loss."
  2: "Async correctness, race conditions, memory/resource leaks."
  3: "Performance/scalability regressions and observability gaps."
  4: "Documentation + style."

tool_authorization:
  - "Full-file read_file required before edits."
  - "Cross-file tracing + schema inspection authorized."
  - "Supabase migrations + SQL definitions accessible for verification."
  - "Token/time cost irrelevant when resolving critical findings."

rejection_criteria:
  immediate_reject:
    - "Any component except backend connecting to Supabase/Postgres."
    - "SQL built via string interpolation/f-strings or without parameters."
    - "Missing await on DB/httpx operations."
    - "Routes without authentication/authorization guards."
    - "Secrets or PII logged, returned, or stored insecurely."
    - "WebSocket handlers lacking disconnect cleanup."
    - "Background tasks launched without references or cancellation."
  must_fix:
    - "Documentation claims work not done."
    - "Missing validation, retries, or idempotency."
    - "Cache invalidation or replication gaps."
    - "Critical flows without automated tests."
    - "Telemetry absent for new routes or Supabase interactions."

case_studies:
  supabase_preload_failure:
    lesson: "Renderer attempted direct Supabase access and failed; backend stays the only proxy."
  tool_registration_race:
    lesson: "Concurrent MCP registration required safe_upsert + retries; race conditions are architecture flaws."
  stream_finalization_gap:
    lesson: "LLM finalizers not awaited caused duplicate sends; await everything."
  storage_stub_loss:
    lesson: "Stubbed persistence silently dropped data; trace the call chain to Supabase every time."

# Backend reliability lives or dies by adherence to this directive. No loopholes.
