name: Unit Tests

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./aether-backend
      run: |
        python -m pip install --upgrade pip
        # Install core scientific stack first to guide resolution
        pip install numpy==1.26.4 scipy==1.14.1 llvmlite==0.43.0 numba==0.60.0
        # Install remaining dependencies with relaxed constraints
        pip install -r requirements.txt
        if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
        
    - name: Run Pytest
      working-directory: ./aether-backend
      run: |
        pytest tests/unit/ -v

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './aether-frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./aether-frontend
      run: npm install
      
    - name: Run Jest tests
      working-directory: ./aether-frontend
      # Run all tests sequentially with coverage disabled
      # CI=true would auto-enable coverage via jest.config.js, so we explicitly disable it
      run: |
        echo "Running tests with coverage disabled..."
        npx jest --testPathPattern="tests/(unit|integration)" --runInBand --coverage=false --testTimeout=30000 --verbose 2>&1 | tee test-output.log
        exit_code=${PIPESTATUS[0]}
        echo "Test exit code: $exit_code"
        if [ $exit_code -ne 0 ]; then
          echo "=== Last 50 lines of test output ==="
          tail -50 test-output.log
        fi
        exit $exit_code
      
