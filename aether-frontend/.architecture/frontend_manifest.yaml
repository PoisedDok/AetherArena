    clients:
      - "src/core/communication/Endpoint.js"
      - "src/infrastructure/api/storage.js"
    validation:
      - "npm run test trail-artifact-roundtrip"
  ipc:
    canonical_ref: "channels.ipc"
    bridges:
      - "src/preload/common/bridge-factory.js"
      - "src/core/ipc/IpcGateway.js"
    validation:
      - "scripts/security-audit.js ipc"
  audio:
    canonical_ref: "channels.audio"
    clients:
      - "src/domain/audio/services/AudioStreamService.js"
      - "src/domain/audio/services/TTSService.js"
    validation:
      - "npm run test audio:smoke"

traceability_bindings:
  identifiers: ["frontendId", "requestId", "correlationId", "backendId", "chatId", "artifactId", "sessionId"]
  telemetry_markers:
    - module: "src/application/main/UIManager.js"
      markers: ["ws:relay", "ipc:send", "event:emit"]
    - module: "src/renderer/chat/modules/messaging/MessageOrchestrator.js"
      markers: ["dom:update", "stream:finalize"]
    - module: "src/domain/artifacts/services/TraceabilityService.js"
      markers: ["trace:track", "trace:restore"]
  audit_artifacts:
    - "architecture_index.json"
    - "logs/security_audit.log"

security_overlays:
  validation_layers:
    - module: "src/domain/settings/validators/SettingsValidator.js"
      jobs: ["JOB_VALIDATE_SCHEMA"]
    - module: "src/preload/common/api-validators.js"
      jobs: ["JOB_VALIDATE_SCHEMA"]
  sanitization:
    - module: "src/core/security/Sanitizer.js"
      jobs: ["JOB_ESCAPE_HTML"]
    - module: "src/renderer/shared/messaging/MarkdownRenderer.js"
      jobs: ["JOB_SANITIZE_MARKDOWN"]
  telemetry:
    - "logs/security_audit.log"

tooling:
  job_tracer:
    script: "scripts/job_tracer.js"
    commands:
      - "node scripts/job_tracer.js list"
      - "node scripts/job_tracer.js export architecture_index.json"
    registry: ".architecture/frontend_manifest.yaml"
  job_validator:
    script: "scripts/validate_job_types.js"
    commands:
      - "node scripts/validate_job_types.js --strict"
  security_audit:
    script: "scripts/security-audit.js"
    commands:
      - "node scripts/security-audit.js ipc"
  outputs:
    - "architecture_index.json"
    - "logs/security_audit.log"
    - "logs/frontend-telemetry.jsonl"

compliance:
  automation:
    - "node scripts/job_tracer.js list"
    - "node scripts/job_tracer.js export architecture_index.json"
    - "node scripts/validate_job_types.js --strict"
    - "node scripts/security-audit.js ipc"
  manual:
    - "npm run test trail-artifact-roundtrip"
    - "Review window.aether.ipc exports against manifest"
  blocking_conditions:
    - "Unknown job identifier in @.architecture"
    - "Unsynchronized manifest/spec versions"
    - "Missing telemetry markers for bound stages"
  escalation:
    sev1: "Block merge until registry parity restored"
    sev2: "Remediate telemetry gaps within 24 hours"
    sev3: "Log informational notice for stale audit artifacts"

change_management:
  checklist:
    - "Update canonical spec before new pipelines"
    - "Regenerate architecture_index.json"
    - "Document manifest delta in docs/STREAMING_PIPELINE_TRACE.md"
  reviewers: ["frontend architecture", "application layer", "security"]
  artifacts:
    - "architecture_index.json"
    - "logs/security_audit.log"
    - "docs/FRONTEND_BACKEND_COMMUNICATION_MAP.md"

sync_monitors:
  cadence: "weekly"
  commands:
    - "node scripts/job_tracer.js export architecture_index.json"
    - "node scripts/validate_job_types.js --strict"
    - "git diff --stat .architecture/frontend_manifest.yaml"

references:
  - ".architecture/data_flow_standard.yaml"
  - ".architecture/module_structure_standard.yaml"
  - ".architecture/security_compliance_standard.yaml"
