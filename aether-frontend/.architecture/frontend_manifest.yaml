Incoming: Architecture standards (data_flow_standard, module_structure_standard, security_compliance_standard) --- {Dict, yaml}
Processing: Bind canonical frontend spec to repository modules, enforce tooling and traceability overlays --- {3 jobs: JOB_AGGREGATE, JOB_ORCHESTRATE, JOB_VALIDATE_SCHEMA}
Outgoing: Job tracer, validation scripts --- {Dict, yaml}

version: "4.1.0"
last_updated: "2026-01-11"
purpose: "Operational manifest aligning frontend implementation with canonical architecture"
changelog:
  "4.1.0":
    - "Removed abandoned application/artifacts and application/interfaces directories"
    - "Added trail domain notation for minimal implementation"
    - "Removed device-specific paths from security standards"
    - "Expanded job types to include all active operations"
    - "Updated to reflect actual codebase structure"
  "4.0.0":
    - "Initial comprehensive manifest"

