pipeline_bindings:
  chat_stream:
    canonical_ref: "pipelines.chat_stream"
    stages:
      - id: "input_capture"
        modules:
          - "src/renderer/chat/modules/messaging/SendController.js"
          - "src/renderer/chat/modules/messaging/StopController.js"
        jobs: ["JOB_VALIDATE_SCHEMA", "JOB_ESCAPE_HTML", "JOB_SEND_IPC", "JOB_STOP"]
      - id: "outbound_transport"
        modules:
          - "src/core/communication/Endpoint.js"
          - "src/core/communication/GuruConnection.js"
        jobs: ["JOB_HTTP_REQUEST", "JOB_WS_SEND"]
      - id: "main_process_relay"
        modules:
          - "src/application/main/MainOrchestrator.js"
          - "src/application/main/ArtifactsStreamOrchestrator.js"
          - "src/application/main/UIManager.js"
        jobs: ["JOB_WS_RECEIVE", "JOB_PARSE_JSON", "JOB_ROUTE_BY_TYPE", "JOB_EMIT_EVENT", "JOB_DETECT_NEW_STREAM", "JOB_FINALIZE_STREAM"]
      - id: "renderer_receive"
        modules:
          - "src/renderer/chat/modules/messaging/StreamHandler.js"
          - "src/renderer/chat/modules/messaging/MessageOrchestrator.js"
        jobs: ["JOB_ACCUMULATE_TEXT", "JOB_DEDUPLICATE_CHUNK", "JOB_PARSE_THINK_TAGS", "JOB_UPDATE_DOM_ELEMENT", "JOB_APPEND_TO_CONTAINER", "JOB_RENDER_MARKDOWN"]
      - id: "persistence_local"
        modules:
          - "src/domain/chat/repositories/ChatRepository.js"
          - "src/domain/chat/repositories/MessageRepository.js"
        jobs: ["JOB_SAVE_TO_DB", "JOB_CACHE_LOCALLY", "JOB_UPDATE_STATE", "JOB_TRACK_ENTITY"]

  artifact_execution:
    canonical_ref: "pipelines.artifact_execution"
    stages:
      - id: "detection"
        modules: ["src/renderer/chat/modules/messaging/StreamHandler.js"]
        jobs: ["JOB_ROUTE_BY_TYPE", "JOB_GENERATE_ARTIFACT_ID", "JOB_VALIDATE_SCHEMA"]
      - id: "ipc_relay"
        modules: ["src/renderer/chat/controllers/ChatController.js"]
        jobs: ["JOB_EMIT_EVENT", "JOB_SEND_IPC"]
      - id: "window_creation"
        modules: ["src/main/windows/WindowManager.js"]
        jobs: ["JOB_INITIALIZE", "JOB_ATTACH_TO_WINDOW", "JOB_SEND_IPC"]
      - id: "execution_request"
        modules: ["src/renderer/artifacts/controllers/ArtifactsController.js"]
        jobs: ["JOB_VALIDATE_SCHEMA", "JOB_WS_SEND"]
      - id: "output_update"
        modules:
          - "src/renderer/artifacts/modules/output/OutputViewer.js"
          - "src/renderer/artifacts/modules/output/renderers/*"
        jobs: ["JOB_RENDER_MARKDOWN", "JOB_SANITIZE_MARKDOWN", "JOB_CREATE_DOM_ELEMENT", "JOB_UPDATE_DOM_ELEMENT"]
      - id: "traceability"
        modules: ["src/domain/artifacts/services/TraceabilityService.js"]
        jobs: ["JOB_TRACK_ENTITY", "JOB_SAVE_TO_DB", "JOB_WRITE_FILE"]

  audio_services:
    canonical_ref: "pipelines.audio_services"
    stages:
      - id: "audio_capture"
        modules: ["src/domain/audio/services/AudioStreamService.js"]
        jobs: ["JOB_INITIALIZE", "JOB_START", "JOB_EMIT_EVENT"]
      - id: "stt_flow"
        modules: ["src/domain/audio/services/STTService.js"]
        jobs: ["JOB_WS_SEND", "JOB_WS_RECEIVE", "JOB_PARSE_JSON"]
      - id: "tts_flow"
        modules: ["src/domain/audio/services/TTSService.js"]
        jobs: ["JOB_WS_SEND", "JOB_ACCUMULATE_TEXT", "JOB_STOP"]
      - id: "audio_playback"
        modules: ["src/domain/audio/services/AudioManager.js"]
        jobs: ["JOB_START", "JOB_STOP", "JOB_DISPOSE"]
      - id: "handsfree_coordination"
        modules: ["src/domain/audio/services/HandsfreeCoordinator.js"]
        jobs: ["JOB_ORCHESTRATE", "JOB_ROUTE_BY_TYPE", "JOB_UPDATE_STATE"]

  session_identity:
    canonical_ref: "pipelines.session_identity"
    stages:
      - id: "session_initialization"
        modules: ["src/core/session/SessionManager.js"]
        jobs: ["JOB_GENERATE_SESSION_ID", "JOB_CLEAR_STATE", "JOB_UPDATE_STATE"]
      - id: "id_generation"
        modules: ["src/core/session/SessionManager.js"]
        jobs: ["JOB_GENERATE_ARTIFACT_ID", "JOB_TRACK_ENTITY"]
      - id: "traceability_linking"
        modules:
          - "src/domain/chat/services/MessageService.js"
          - "src/domain/artifacts/services/TraceabilityService.js"
        jobs: ["JOB_TRACK_ENTITY", "JOB_RESTORE_ID", "JOB_SAVE_TO_DB"]

channel_bindings:
  websocket:
