Incoming: Architecture standards (data_flow_standard, module_structure_standard) --- {Dict[str, Any], yaml}
Processing: Provide canonical templates to add renderer/main capabilities and bind backend integrations --- {3 jobs: JOB_LOG, JOB_ORCHESTRATE, JOB_VALIDATE_SCHEMA}
Outgoing: Frontend manifest, job tracer scripts --- {Dict[str, Any], yaml}

version: "3.0.0"
last_updated: "2026-01-11"
purpose: "Abstract, production-ready scaffolding for new frontend capabilities and backend integration bindings."

references:
  standards:
    - ".architecture/data_flow_standard.yaml"
    - ".architecture/security_compliance_standard.yaml"
    - ".architecture/module_structure_standard.yaml"
  manifests:
    - ".architecture/frontend_manifest.yaml"
  backend_registry:
    - "../aether-backend/config/integrations_registry.yaml"

sections:
  capability_template:
    description: "Steps to introduce a new renderer/main capability spanning multiple layers."
    checklist:
      - "Add domain service under src/domain/<area>/services/<Feature>Service.js."
      - "Expose renderer/controller code under src/renderer/<area>/modules/<Feature>Controller.js."
      - "Extend communication layer (src/core/communication) if new transport is required."
      - "Whitelist IPC channels in src/preload/common/bridge-factory.js with validators."
      - "Register telemetry markers in src/application/main/telemetry/TelemetryBus.js."
      - "Update @.architecture docs and job usages to match frontend_job_registry.yaml."
      - "Add unit/integration tests, run job_tracer and validators."
    schema:
      id: "kebab-case-feature-id"
      enabled: true
      priority: 1
      description: "Short description of the capability."
      layers_touched: ["application_main", "renderer", "domain", "infrastructure", "preload"]
      renderer_module:
        file: "src/renderer/<area>/modules/<Feature>Controller.js"
        responsibilities:
          - "Render sanitized UI."
          - "Emit application events with correlation metadata."
      domain_service:
        file: "src/domain/<area>/services/<Feature>Service.js"
        responsibilities:
          - "Pure transforms and validation."
      transport:
        http_endpoints: []
        websocket_channels: []
        ipc_channels: []
      telemetry:
        logs:
          - "Feature logs tagged with feature_id."
        metrics:
          - "Latency and error counters."
        tracing:
          - "feature.<id>.* spans where applicable."
      validation:
        pre_render:
          - "JOB_VALIDATE_SCHEMA"
          - "JOB_ESCAPE_HTML"
        pre_transport:
          - "JOB_VALIDATE_SCHEMA"
          - "JOB_PARSE_JSON"

  integration_binding_template:
    description: "Binding contract for wiring backend integrations into frontend surfaces."
    schema:
      integration_id: "snake_case_identifier"
      backend_registry_ref: "../aether-backend/config/integrations_registry.yaml::integrations.<integration_id>"
      enabled_by_default: false
      ui_bindings:
        settings_panel:
          files:
            - "src/renderer/main/modules/settings/SettingsController.js"
            - "src/application/main/modules/settings/SettingsManager.js"
          form_fields:
            - {id: "integrations.<integration_id>.enabled", label: "Enable <Integration Name>", type: "toggle"}
            - {id: "integrations.<integration_id>.timeoutSeconds", label: "Timeout (seconds)", type: "number"}
          validators:
            - "src/domain/settings/validators/SettingsValidator.js"
        ipc_channels:
          outbound:
            - {channel: "chat:send-message", guard: "preload/common/api-validators.js"}
          inbound:
            - {channel: "chat:assistant-stream", handler: "src/application/main/UIManager.js"}
        application_main:
          orchestrators:
            - "src/application/main/UIManager.js"
          handlers:
            - "src/application/main/ArtifactsStreamHandler.js"
        renderer_modules:
          chat:
            - "src/renderer/chat/modules/messaging/StreamHandler.js"
            - "src/renderer/chat/modules/messaging/MessageManager.js"
          artifacts:
            - "src/renderer/artifacts/controllers/ArtifactsController.js"
            - "src/renderer/artifacts/modules/output/OutputViewer.js"
            - "src/renderer/artifacts/modules/output/renderers/MarkdownRenderer.js"
            - "src/renderer/artifacts/modules/output/renderers/HtmlRenderer.js"
    pipeline_touchpoints:
      chat_stream:
        stages_to_touch:
          - {id: "outbound_transport", jobs: ["JOB_HTTP_REQUEST", "JOB_WS_SEND"]}
          - {id: "main_process_relay", jobs: ["JOB_WS_RECEIVE", "JOB_PARSE_JSON", "JOB_ROUTE_BY_TYPE", "JOB_EMIT_EVENT"]}
          - {id: "renderer_receive", jobs: ["JOB_ACCUMULATE_TEXT", "JOB_DEDUPLICATE_CHUNK", "JOB_UPDATE_DOM_ELEMENT", "JOB_RENDER_MARKDOWN"]}
      artifact_execution:
        stages_to_touch:
          - {id: "execution_request", jobs: ["JOB_VALIDATE_SCHEMA", "JOB_WS_SEND"]}
          - {id: "websocket_relay", jobs: ["JOB_WS_RECEIVE", "JOB_PARSE_JSON", "JOB_ROUTE_BY_TYPE"]}
          - {id: "output_update", jobs: ["JOB_RENDER_MARKDOWN", "JOB_SANITIZE_MARKDOWN", "JOB_CREATE_DOM_ELEMENT", "JOB_UPDATE_DOM_ELEMENT"]}
    telemetry_bindings:
      logs:
        - {file: "src/application/main/UIManager.js", markers: ["ws:relay", "ipc:send", "event:emit"]}
        - {file: "src/renderer/chat/modules/messaging/MessageManager.js", markers: ["dom:update", "stream:finalize"]}
      metrics:
        - "IPC latency"
        - "Retry count"
      traceability:
        identifiers: ["frontendId", "requestId", "correlationId", "backendId", "chatId", "artifactId"]
    security_overlays:
      validation_layers:
        - {file: "src/domain/settings/validators/SettingsValidator.js", jobs: ["JOB_VALIDATE_SCHEMA"]}
        - {file: "src/preload/common/api-validators.js", jobs: ["JOB_VALIDATE_SCHEMA"]}
      sanitization_layers:
        - {file: "src/core/security/Sanitizer.js", jobs: ["JOB_ESCAPE_HTML"]}
        - {file: "src/renderer/chat/modules/messaging/MarkdownRenderer.js", jobs: ["JOB_SANITIZE_MARKDOWN"]}
    testing:
      unit:
        - "npm run test -w aether-frontend -- SettingsValidator"
        - "npm run test -w aether-frontend -- ChatRepository"
      integration:
        - "npm run test trail-artifact-roundtrip"
      manual:
        - "Toggle integration in settings, verify backend tool usage + telemetry."
        - "Confirm DOM sanitization markers for stream events."
    change_management:
      checklist:
        - "Sync frontend_manifest layer/pipeline bindings."
        - "Update job/data registries for new identifiers."
        - "Export architecture_index.json via job_tracer."
      reviewers: ["frontend architecture", "application-main", "security"]

  example_capability:
    id: "artifacts-pane"
    enabled: true
    priority: 1
    description: "Renderer + main capability that surfaces artifact execution panes."
    layers_touched: ["application_main", "renderer", "domain", "preload"]
    renderer_module:
      file: "src/renderer/artifacts/controllers/ArtifactsController.js"
      responsibilities:
        - "Render output viewer windows safely."
        - "Emit IPC commands for artifact execution."
    domain_service:
      file: "src/domain/artifacts/services/TraceabilityService.js"
      responsibilities:
        - "Track artifact linkage to backend ids."
    transport:
      websocket_channels: ["{backend_websocket_endpoint}"]
      ipc_channels: ["artifacts:execute", "artifacts:output"]
    telemetry:
      logs:
        - "ArtifactsController logs artifact:execute + artifact:output."
      metrics:
        - "Execution latency"
      tracing:
        - "feature.artifacts.* spans"
    validation:
      pre_render:
        - "JOB_VALIDATE_SCHEMA"
        - "JOB_SANITIZE_MARKDOWN"
      pre_transport:
        - "JOB_VALIDATE_SCHEMA"
        - "JOB_PARSE_JSON"

  example_integration_binding:
    integration_id: "example_service"
    backend_registry_ref: "../aether-backend/config/integrations_registry.yaml::integrations.example_service"
    enabled_by_default: false
    ui_bindings:
      settings_panel:
        files:
          - "src/renderer/main/modules/settings/SettingsController.js"
          - "src/application/main/modules/settings/SettingsManager.js"
        form_fields:
          - {id: "integrations.example_service.enabled", label: "Enable Example Service", type: "toggle"}
          - {id: "integrations.example_service.timeoutSeconds", label: "Timeout (seconds)", type: "number"}
        validators:
          - "src/domain/settings/validators/SettingsValidator.js"
      ipc_channels:
        outbound:
          - {channel: "chat:send-message", guard: "preload/common/api-validators.js"}
        inbound:
          - {channel: "chat:assistant-stream", handler: "src/application/main/UIManager.js"}
      application_main:
        orchestrators:
          - "src/application/main/UIManager.js"
        handlers:
          - "src/application/main/ArtifactsStreamHandler.js"
      renderer_modules:
        chat:
          - "src/renderer/chat/modules/messaging/StreamHandler.js"
          - "src/renderer/chat/modules/messaging/MessageManager.js"
        artifacts:
          - "src/renderer/artifacts/controllers/ArtifactsController.js"
          - "src/renderer/artifacts/modules/output/OutputViewer.js"
          - "src/renderer/artifacts/modules/output/renderers/MarkdownRenderer.js"
          - "src/renderer/artifacts/modules/output/renderers/HtmlRenderer.js"
    pipeline_integration:
      chat_stream:
        stages_to_touch:
          - {id: "outbound_transport", jobs: ["JOB_HTTP_REQUEST", "JOB_WS_SEND"]}
          - {id: "main_process_relay", jobs: ["JOB_WS_RECEIVE", "JOB_PARSE_JSON", "JOB_ROUTE_BY_TYPE", "JOB_EMIT_EVENT", "JOB_FINALIZE_STREAM"]}
          - {id: "renderer_receive", jobs: ["JOB_ACCUMULATE_TEXT", "JOB_DEDUPLICATE_CHUNK", "JOB_UPDATE_DOM_ELEMENT", "JOB_RENDER_MARKDOWN"]}
      artifact_execution:
        stages_to_touch:
          - {id: "execution_request", jobs: ["JOB_VALIDATE_SCHEMA", "JOB_WS_SEND"]}
          - {id: "websocket_relay", jobs: ["JOB_WS_RECEIVE", "JOB_PARSE_JSON", "JOB_ROUTE_BY_TYPE"]}
          - {id: "output_update", jobs: ["JOB_RENDER_MARKDOWN", "JOB_SANITIZE_MARKDOWN", "JOB_CREATE_DOM_ELEMENT", "JOB_UPDATE_DOM_ELEMENT"]}
    telemetry_bindings:
      logs:
        - {file: "src/application/main/UIManager.js", markers: ["ws:relay", "ipc:send", "event:emit"]}
        - {file: "src/renderer/chat/modules/messaging/MessageManager.js", markers: ["dom:update", "stream:finalize"]}
      metrics:
        - "IPC latency"
        - "Retry count"
      traceability:
        identifiers: ["frontendId", "requestId", "correlationId", "backendId", "chatId", "artifactId"]
    security_overlays:
      validation_layers:
        - {file: "src/domain/settings/validators/SettingsValidator.js", jobs: ["JOB_VALIDATE_SCHEMA"]}
        - {file: "src/preload/common/api-validators.js", jobs: ["JOB_VALIDATE_SCHEMA"]}
      sanitization_layers:
        - {file: "src/core/security/Sanitizer.js", jobs: ["JOB_ESCAPE_HTML"]}
        - {file: "src/renderer/chat/modules/messaging/MarkdownRenderer.js", jobs: ["JOB_SANITIZE_MARKDOWN"]}
    testing:
      unit:
        - "npm run test -w aether-frontend -- SettingsValidator"
      integration:
        - "npm run test trail-artifact-roundtrip"
      manual:
        - "Toggle Example Service, verify streaming telemetry + sanitized DOM."

validation_commands:
  - "node scripts/job_tracer.js list"
  - "node scripts/job_tracer.js export architecture_index.json"
  - "node scripts/validate_job_types.js --strict"
  - "node scripts/security-audit.js ipc"
