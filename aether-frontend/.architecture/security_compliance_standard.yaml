Incoming: Architecture standards (security_compliance_standard, frontend_architecture_standard) --- {Dict[str, Any], yaml}
Processing: Codify renderer, preload, and application-main guardrails for IPC, CSP, transport, and telemetry --- {3 jobs: JOB_TRACE, JOB_VALIDATE_SCHEMA, JOB_LOG}
Outgoing: Frontend manifest, security audit scripts --- {Dict[str, Any], yaml}

version: "2.0.0"
name: "Frontend Security & Compliance Standard"
last_updated: "2026-01-11"

controls:
  csp:
    mandates:
      - "default-src 'self'; block inline script/style unless hashed."
      - "HtmlRenderer enforces sandboxed iframes with allow-same-origin=false."
      - "Renderer templates sanitize and escape every untrusted string."
    verification:
      - "npm run test --workspace aether-frontend -- settings:csp"
      - "node scripts/security-audit.js ipc --check-csp"
  ipc_guardrails:
    mandates:
      - "Expose least-privilege APIs via preload/common/bridge-factory.js and Object.freeze surfaces."
      - "Validate sender origins in main/services/IpcRouter.js and block unregistered windows."
      - "All IPC payloads validated via preload/common/api-validators.js before routing."
      - "Renderer never calls Node APIs or filesystem; everything funnels through contextBridge."
    telemetry:
      - "Bridge factory logs ipc:bridge:create and ipc:bridge:deny events."
      - "Rate limiter emits security:rateLimit with channel metadata."
  transport:
    mandates:
      - "HTTP and WebSocket clients attach {frontendId, correlationId, requestId, operatorId} headers."
      - "AbortController wraps every fetch/stream; retries honor exponential backoff."
      - "StopController dispatches stopRequest before any stream shutdown."
    observability:
      - "GuruConnection logs ws:connect/ws:disconnect along with correlationId."
      - "ApiClient logs http:request/http:response with scrubbed payload metadata."
  data_privacy:
    mandates:
      - "Never persist secrets or tokens client-side; SessionManager keys stored in memory only."
      - "Telemetry redacts PII fields before logging; use Sanitizer.redactSensitive."
      - "PII removal validated prior to DOM writes and IPC sends."
    audit:
      - "Logs/security_audit.log captures redaction proofs per release."
  validation:
    mandates:
      - "Schemas live beside the module owning validation (domain validators, preload guards, renderer services)."
      - "JOB_VALIDATE_SCHEMA precedes every state mutation, transport, or render."
      - "Unknown schema fields rejected with telemetry + user-safe errors."
    tooling:
      - "node scripts/validate_job_types.js --strict"
      - "node scripts/job_tracer.js list --domain frontend --violations"
  observability:
    mandates:
      - "TelemetryBus attaches correlationId, frontendId, backendId to every log."
      - "Renderer + main-process metrics capture IPC latency, retry counts, and security throttles."
      - "Security incidents escalate via structured logs + audible UI warnings."

enforcement:
  automation:
    - "node scripts/security-audit.js ipc"
    - "node scripts/job_tracer.js list --violations"
    - "npm run test -w aether-frontend -- --selectProjects security"
  manual:
    - "Verify CSP headers in packaged builds before shipping."
    - "Spot-check contextBridge exports for least-privilege scope during code review."

references:
  - ".architecture/frontend_manifest.yaml"
  - ".architecture/data_flow_standard.yaml"
  - ".architecture/module_structure_standard.yaml"
  - ".architecture/security_compliance_standard.yaml"
