  transport_safety:
    - "HTTP/WS clients attach correlation metadata; respect circuit-breakers."
    - "Retry idempotent requests; surface degraded modes."
  dom_sanitization:
    - "Escape HTML; sanitize markdown; never inject raw unsanitized content."
