Processing: Codify frontend analysis directive, enforce transport/IPC/DOM guardrails --- {3 jobs: JOB_EMIT_EVENT, JOB_TRACK_ENTITY, JOB_VALIDATE_SCHEMA}
Outgoing: .architecture/frontend_manifest.yaml, scripts/job_tracer.js contract enforcement --- {Dict[str, Any], yaml}

