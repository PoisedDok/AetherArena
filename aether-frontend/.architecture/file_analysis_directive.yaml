workflow:
  step_1_read: "Use read_file to ingest the full module."
  step_2_map: "Trace UI → app_main → IPC/HTTP/WS dependencies and shared state."
  step_3_assess: "Run analysis_matrix checks (IPC, transport, DOM, security, observability, performance)."
  step_4_fix: "Repair guardrails before docs."
