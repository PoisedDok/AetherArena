# FRONTEND FILE ANALYSIS DIRECTIVE - TRACEABLE IPC SAFEGUARDS
# =============================================================================
# Mission order for renderer + preload engineers and automation agents. No dilution.
# =============================================================================

version: "4.0.0"
audience: ["renderer engineers", "preload engineers", "automation agents"]
scope: ["frontend"]
stack: ["Electron renderer", "preload bridge", "shared renderer-domain modules"]

mission:
  statement: "Deliver deterministic, observable, zero-trust renderer code for single-operator local deployments that never bypasses backend authority."
  guardrails:
    - "Frontend owns presentation + orchestration only; persistence and secrets remain backend-only, even on localhost."
    - "Every async hop carries correlation + session identifiers with sanitized logging."
    - "Modules remain composable: controllers orchestrate, services stay pure, views stay declarative."
    - "Renderer resilience > feature velocity. If cleanup, validation, or telemetry is missing, halt—even in local-only runs."

invariants:
  single_database: "Renderer never instantiates Supabase/Postgres clients. All data flows: Renderer → IPC → Backend HTTP → Supabase."
  single_operator: "Exactly one authenticated operator per deployment; identity flows may default to local profile but must still emit correlation + audit metadata."
  sandboxing: "Renderer runs with nodeIntegration=false; preload exposes only typed, documented, least-privilege APIs."
  traceability: "CorrelationId/sessionId attached to every IPC call, log line, and telemetry event."
  zero_trust: "Treat main-process + backend responses as untrusted until schema validation + sanitization succeed."
  observability: "Structured logs + metrics land before merge, redacting tokens/PII and preserving retention SLAs for local archives."

references:
  - ".architecture/frontend_manifest.yaml"
  - ".architecture/data_flow_standard.yaml"
  - ".architecture/module_structure_standard.yaml"
  - ".architecture/security_compliance_standard.yaml"
  - "../aether-backend/.architecture/data_flow_standard.yaml"
  - "../aether-backend/.architecture/backend_manifest.yaml"

agent_protocol:
  - "Inject this directive into every AI/automation session touching frontend files—refuse to operate without it."
  - "Challenge requirements; expose weak reasoning, missing validators, or absent cleanup before coding."
  - "Surface blind spots aggressively: coupled modules, unbounded caches, silent retries, or telemetry gaps."
  - "If observability, documentation, or contracts lag, implement them first; features wait."
  - "Reject 'temporary' hacks. Either ship production-safe code or decline the work."

enforcement_expectations:
  - "CI/review gates reject PRs lacking mandated doc templates or breaking single-database doctrine."
  - "data_flow_standard.yaml stays current; update job type registry before referencing new identifiers."
  - "Telemetry pipelines must persist correlationId/sessionId with redaction policies proven by tests."
  - "Renderer + IPC logs stream to centralized storage; auditors can reconstruct any session."
  - "Directive stays abstract/evergreen—no environment- or feature-specific clauses."
  - "Maintain parity with .architecture/data_flow_standard.yaml; update job type registry before referencing new identifiers."

workflow:
  step_1_read: "Use read_file to load the entire file. Anything less is a violation."
  step_2_map: "Trace stateful modules, IPC edges, event listeners, and renderer → backend contracts."
  step_3_assess: "Run every item in analysis_matrix; note each violation before touching code."
  step_4_fix: "Address async correctness, validation, cleanup, and observability before docs."
  step_5_validate: "Cross-check data/job registries, correlation IDs, and IPC schemas."
  step_6_document: "Apply documentation_requirements template with registry-backed identifiers only."
  step_7_report: "Produce bug report + verification evidence (tests/manual steps) prior to merge."

documentation_requirements:
  template_lines:
    - "Incoming: <source refs> --- {<data_type ref>, <format>}"
    - "Processing: <operations summary> --- {<N> jobs: JOB_A, JOB_B, …}"
    - "Outgoing: <dest refs> --- {<data_type ref>, <format>}"
  validation:
    - "Read full file first; partial context invalidates the doc."
    - "Data/job types reference registry IDs verbatim from .architecture/data_flow_standard.yaml; job list alphabetical."
    - "Sources/destinations cite modules, IPC channels, queues, or APIs by name."
    - "Content describes behavior only—no code snippets, no pseudo-code."
    - "When nothing applies, record 'none' exactly once."

analysis_matrix:
  async_integrity:
    - "Await every async call or batch via Promise.all with try/finally cleanup."
    - "AbortControllers guard fetch/LLM streams; cancellation propagates to renderer state."
    - "Finalizers awaited before state mutations or IPC notifications."
  state_integrity:
    - "Shared objects immutable; copy before mutation. No racey mid-flight resets."
    - "ID generation deterministic (chatId_sequence_type) and logged with correlationId."
    - "Cache invalidation explicit; stale data flagged via versioning."
  memory_lifecycle:
    - "Event listeners, observers, timers, and intervals cleared in dispose hooks."
    - "DOM/Node references nulled post-removal; WeakMap when lifetime uncertain."
    - "No unbounded caches or Maps/Sets; implement eviction + telemetry."
  security_surface:
    - "All user/content input validated + sanitized before DOM or IPC."
    - "Never touch innerHTML/unsafeEval; rely on DOM APIs or sanitized templates."
    - "Block javascript:/data:/file: URLs; enforce CSP parity with backend."
    - "Secrets/tokens never stored or logged client-side."
  communication_contract:
    - "IPC channels whitelisted; payload schemas versioned + validated both directions."
    - "Backoff strategy explicit (cap, jitter) with user feedback for retries."
    - "Renderer logs correlationId, channel, payload shape (no PII) for every IPC round-trip."
    - "Responses validated before altering state/UI; invalid payloads trigger kill-switch."
  traceability_controls:
    - "Long-running ops emit telemetry for start/progress/stop + correlationId."
    - "Artifacts/messages cross-link only after backend persistence confirmation."
    - "UI progress indicators track backend acknowledgments, not optimistic guesses."
  ux_resilience:
    - "Error boundaries surface sanitized, actionable text."
    - "Offline/IPC-failure states provide fallback + retry with telemetry."
    - "LLM/stream interruptions always trigger StopController cleanup + user feedback."

integration_contracts:
  renderer_to_main_process:
    - "ContextBridge exposes typed, least-privilege APIs; no dynamic eval."
    - "Handlers enforce schema validation + auth before backend proxies execute."
    - "Main-process errors return sanitized payloads tagged with correlationId."
  renderer_to_backend:
    - "Only IPC bridge modules (SendController, StopController, etc.) may call backend."
    - "HTTP endpoints live behind IPC proxies; renderer never crafts Supabase queries or tokens."
    - "Streaming endpoints preserve frontend-generated IDs and restore them in responses."
  auditability:
    - "All renderer ↔ backend interactions logged with monotonic timestamps."
    - "Snapshot tests capture DOM + styling for trail/artifact flows prior to merge."

observability_contract:
  - "Structured logs emit JSON with correlationId, sessionId, userId, channel, severity."
  - "Metrics capture IPC latency, retry counts, memory usage, and cache eviction."
  - "Telemetry redaction policies tested; no raw secrets or PII leave the process."
  - "Alerting wired for IPC failure spikes, unbounded listeners, or dropped Stop events."

testing_accountability:
  - "Unit tests cover pure services + validators (ArtifactValidator, etc.)."
  - "Integration tests simulate chat/trail round-trips with IPC stubs + backend mocks."
  - "Simulation scripts run Send/Stop streaming with cancellation + resume scenarios."
  - "Snapshot + visual regression tests guard Trail/Artifacts DOM renderers."
  - "Any bug fix accompanied by regression test or documented manual reproduction."

release_gates:
  - "CI enforces lint/tests + documentation template + telemetry schema changes."
  - "Manual review checklist covers single-database compliance, IPC schemas, and tracing evidence."
  - "Feature toggles default off until observability dashboards confirm stability."

bug_reporting:
  fields:
    - "FILE: <absolute path>"
    - "BUG: <category> - <concise description>"
    - "IMPACT: <severity> - <data loss / security / UX consequence>"
    - "FIX: <summary of code changes>"
    - "VERIFIED: <tests or manual steps>"

priorities:
  1: "Security breaches, traceability gaps, single-database violations."
  2: "Async/state corruption, race conditions, resource leaks."
  3: "Observability, telemetry, and validation gaps."
  4: "Documentation + architecture metadata."
  5: "Stylistic or cosmetic issues."

tool_authorization:
  - "Full-file read_file calls mandatory before edits."
  - "Cross-file tracing allowed when validating IPC contracts."
  - "Backend files may be inspected solely to confirm contract expectations."
  - "Token/time cost irrelevant when protecting security or data integrity."

rejection_criteria:
  immediate_reject:
    - "Renderer/preload code instantiating Supabase/Postgres clients."
    - "IPC calls lacking schema validation or correlation IDs."
    - "Async functions invoking other async work without await/Promise.all."
    - "User-controlled strings injected into DOM/HTML without sanitization."
    - "Secrets/tokens/PII logged, stored, or cached client-side."
    - "State mutations that desynchronize renderer ↔ backend truth."
  must_fix:
    - "Documentation claims nonexistent work."
    - "Missing cleanup/dispose paths or AbortControllers."
    - "Unhandled Promise rejections or silent failure paths."
    - "Cache invalidation gaps or stale data without versioning."
    - "Critical flows lacking automated tests or telemetry."

case_studies:
  supabase_client_renderer:
    lesson: "Direct Supabase usage in renderer failed (stream module). IPC proxy only—forever."
  persistence_stub_loss:
    lesson: "Stubbed persistence caused silent data loss; verify storageAPI/IPC completion."
  finalize_stream_race:
    lesson: "Not awaiting _finalizeStream() corrupted state; finalizers must be awaited."
  mcp_registration_conflict:
    lesson: "Concurrent registrations require safe_upsert + retries; race conditions are design bugs."

# End of directive. If something feels optional, you misread it.
