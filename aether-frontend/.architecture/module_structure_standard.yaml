Incoming: Architecture standards (frontend_architecture_standard, module_structure_standard) --- {Dict[str, Any], yaml}
Processing: Map Electron layers to responsibilities, dependency rules, and instrumentation guardrails --- {3 jobs: JOB_ROUTE_BY_TYPE, JOB_TRACK_ENTITY, JOB_VALIDATE_SCHEMA}
Outgoing: Frontend manifest, job tracer contract enforcement --- {Dict[str, Any], yaml}

version: "2.0.0"
name: "Frontend Module Structure Standard"
last_updated: "2026-01-11"

layers:
  - layer: preload
    responsibilities:
      - "Expose least-privilege APIs via contextBridge and freeze every surface."
      - "Validate IPC channel usage, enforce rate limits, and sanitize payloads."
    allowed_dependencies: ["preload", "core"]
    prohibited_dependencies: ["renderer", "domain", "infrastructure"]
    instrumentation:
      - "Bridge factory logs bridge:create + channel metadata."
      - "Rate limiter emits ipc:throttle events."
  - layer: application_main
    responsibilities:
      - "Own orchestration, transport routing, and telemetry coordination."
      - "Translate renderer intent into backend IPC/HTTP/WebSocket calls."
      - "Manage window lifecycle, session identity, and backpressure."
    allowed_dependencies: ["application_main", "domain", "core", "infrastructure", "preload"]
    prohibited_dependencies: ["renderer"]
    instrumentation:
      - "TelemetryBus logs ws:relay, ipc:send, http:request markers."
      - "State reducers log state:update with before/after diffs."
  - layer: renderer
    responsibilities:
      - "Render sanitized DOM, manage UI interactions, and emit view telemetry."
      - "Consume IPC events and update presentation state without transport calls."
    allowed_dependencies: ["renderer", "shared view utilities"]
    prohibited_dependencies: ["preload", "infrastructure", "core/node APIs"]
    instrumentation:
      - "Message managers log dom:update + stream:finalize."
      - "Controllers log form:populate + form:collect."
  - layer: domain
    responsibilities:
      - "Hold pure logic, validators, repositories, and traceability services."
      - "Expose deterministic ID generators and state transforms."
    allowed_dependencies: ["domain", "core", "infrastructure"]
    prohibited_dependencies: ["renderer", "preload"]
    instrumentation:
      - "Traceability services log trace:track + trace:restore."
      - "Repositories emit state:diff and persistence:* markers."
  - layer: infrastructure
    responsibilities:
      - "HTTP/WS clients, IPC adapters, filesystem helpers, and backend proxies."
      - "Provide transport primitives with observability and retries."
    allowed_dependencies: ["infrastructure", "core"]
    prohibited_dependencies: ["renderer"]
    instrumentation:
      - "API clients log transport:http w/ latency histograms."
      - "WS connections log ws:* lifecycle events."
  - layer: core
    responsibilities:
      - "Session identifiers, security primitives, configuration, and shared utilities."
      - "Zero side effects outside initialization."
    allowed_dependencies: ["core"]
    prohibited_dependencies: ["renderer", "application_main", "domain", "infrastructure"]
    instrumentation:
      - "Session managers log id:* events."
      - "Sanitizers log security:escape metrics."

guidelines:
  - "Follow data flow documentation template defined in .architecture/data_flow_standard.yaml for every module."
  - "Renderer depends on application_main via IPC only; never import main-process modules."
  - "Application_main depends on domain + infrastructure; domain remains pure logic with deterministic outputs."
  - "Preload owns all contextBridge exports; renderer accesses Node features exclusively through these bridges."
  - "Infrastructure modules expose typed clients and never manipulate DOM or renderer state."
  - "Core utilities avoid runtime side effects; treat them as pure libraries."

enforcement:
  automation:
    - "job_tracer.js list --violations"
    - "security-audit.js ipc"
    - "lint with architecture-layers:error rule"
  manual:
    - "Review dependency graphs before merging modules that cross layers."
    - "Inspect contextBridge surfaces to verify least-privilege exports after preload edits."

references:
  - ".architecture/frontend_manifest.yaml"
  - ".architecture/data_flow_standard.yaml"
  - ".architecture/security_compliance_standard.yaml"
