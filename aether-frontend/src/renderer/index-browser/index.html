<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- CSP injected by index-browser-preload.js -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Index Browser</title>
  
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../shared/styles/theme.css" />
  <link rel="stylesheet" href="../shared/styles/index.css" />
  <link rel="stylesheet" href="../shared/styles/modal-base.css" />
  <link rel="stylesheet" href="../shared/styles/components.css" />
  <link rel="stylesheet" href="../main/styles/index-browser.css" />
  <link rel="stylesheet" href="../main/styles/indexing-modals.css" />
  <link rel="stylesheet" href="../main/styles/file-indexing.css" />
  <link rel="stylesheet" href="../main/styles/browser-history.css" />
  <link rel="stylesheet" href="../main/styles/modals.css" />
  <link rel="stylesheet" href="../chat/styles/chat-modals.css" />
  <link rel="stylesheet" href="../chat/styles/syntax-highlighting.css" />
  
  <style>
    :root {
      --bg-color: #1e1e1e;
      --header-bg: #252526;
      --border-color: #333;
      --text-primary: #ffffff;
      --text-secondary: #aaaaaa;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-primary);
    }
    
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    
    /* Title bar - Drag region */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
      padding: 0 12px;
      user-select: none;
      position: relative;
      z-index: 10001;
    }
    
    .titlebar-left {
      display: flex;
      align-items: center;
      flex: 1;
    }
    
    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      -webkit-app-region: no-drag;
      white-space: nowrap;
    }
    
    .titlebar-controls {
      display: flex;
      -webkit-app-region: no-drag;
      gap: 6px;
      margin-left: 10px;
    }
    
    .control-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    .control-btn:hover {
      background: var(--hover-bg, rgba(255, 255, 255, 0.1));
      color: var(--text-primary);
    }
    
    .control-btn.close:hover {
      background: #e81123;
      color: white;
    }
    
    #modal-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    /* Override IndexBrowserModal internal styles for full-window usage */
    #modal-container .modal-overlay {
      position: absolute !important;
      background: transparent !important;
      backdrop-filter: none !important;
      z-index: 10000;
    }
    
    #modal-container .modal-panel {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
      backdrop-filter: none !important;
    }
    
    #modal-container .modal-header {
      display: none !important; /* Use our custom titlebar instead */
    }
    
  </style>
</head>
<body>
  <div id="app">
    <div class="titlebar">
      <div class="titlebar-left">
        <span class="titlebar-title">Index Browser</span>
      </div>
      <div class="titlebar-controls">
        <button class="control-btn" id="btn-minimize" title="Minimize">
          <i class="fas fa-minus"></i>
        </button>
        <button class="control-btn" id="btn-maximize" title="Maximize">
          <i class="fas fa-expand"></i>
        </button>
        <button class="control-btn close" id="btn-close" title="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    
    <div id="modal-container">
      <!-- IndexBrowserModal will be injected here -->
    </div>
  </div>

  <script src="../../../build/renderer/index-browser.js"></script>
</body>
</html>
