<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- CSP injected by research-preload.js -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Research Dashboard</title>
  
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../shared/styles/theme.css" />
  <link rel="stylesheet" href="../shared/styles/index.css" />
  <link rel="stylesheet" href="../shared/styles/modal-base.css" />
  <link rel="stylesheet" href="../shared/styles/components.css" />
  <link rel="stylesheet" href="../main/styles/research-window.css" />
  
  <style>
    :root {
      --bg-color: #1e1e1e;
      --header-bg: #252526;
      --border-color: #333;
      --text-primary: #ffffff;
      --text-secondary: #aaaaaa;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-primary);
    }
    
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    
    /* Title bar - Drag region */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
      padding: 0 12px;
      user-select: none;
    }
    
    .titlebar-left {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 12px;
    }
    
    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      -webkit-app-region: no-drag;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .titlebar-controls {
      display: flex;
      -webkit-app-region: no-drag;
      gap: 6px;
      margin-left: 10px;
    }
    
    .control-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .control-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }
    
    .control-btn.close:hover {
      background-color: #e81123;
      color: white;
    }

    #perplexica-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-color);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="titlebar">
      <div class="titlebar-left">
        <div class="titlebar-title">
          <i class="fas fa-search"></i>
          Research Dashboard
        </div>
        <span class="perplexica-service-status">
          <span class="status-dot status-loading"></span>
          <span class="status-text">Connecting...</span>
        </span>
      </div>
      <div class="titlebar-controls">
        <button class="control-btn" id="btn-minimize" title="Minimize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect fill="currentColor" width="10" height="1" x="1" y="6"></rect></svg>
        </button>
        <button class="control-btn" id="btn-maximize" title="Maximize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect fill="none" stroke="currentColor" width="9" height="9" x="1.5" y="1.5"></rect></svg>
        </button>
        <button class="control-btn close" id="btn-close" title="Close">
          <svg width="12" height="12" viewBox="0 0 12 12"><polygon fill="currentColor" fill-rule="evenodd" points="11 1.576 6.583 6 11 10.424 10.424 11 6 6.583 1.576 11 1 10.424 5.417 6 1 1.576 1.576 1 6 5.417 10.424 1"></polygon></svg>
        </button>
      </div>
    </div>
    <div id="perplexica-container">
      <iframe 
        id="perplexica-iframe"
        class="perplexica-iframe"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals allow-popups-to-escape-sandbox"
        style="width: 100%; height: 100%; border: none; background: transparent; border-radius: inherit; display: none;"
        title="Agent Dashboard"
      ></iframe>
      
      <div class="perplexica-iframe-loading" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">
          <div>Connecting to Research Dashboard...</div>
          <div class="loading-subtext">Initializing secure connection...</div>
        </div>
      </div>
      
      <div class="perplexica-iframe-error" id="error-overlay" style="display: none;">
        <div class="error-icon">
          <i class="fas fa-exclamation-triangle"></i>
        </div>
        <div class="error-text">
          <div class="error-title">Interface Unavailable</div>
          <div class="error-message">The agent dashboard is currently unreachable</div>
          <div class="error-hint">Check system services and try again</div>
        </div>
        <div class="error-actions">
          <button class="btn-secondary btn-sm" id="btn-retry">
            <i class="fas fa-redo"></i> Retry
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Main Script -->
  <script src="../../../build/renderer/research.js"></script>
</body>
</html>
